<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조행기 인트로 지도</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3b2a1a; --paper:#f3e6c4; --route:#d4231f; }
  html,body { margin:0; height:100%; background:#1b140d; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 1672 / 941)); aspect-ratio:1672/941; overflow:hidden; }
  #stage svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #controls { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px; font:14px sans-serif; }
  #controls button { background:#f3e6c4; color:#3b2a1a; border:1px solid #8a6a3a; border-radius:6px; padding:6px 14px; cursor:pointer; }
  body.record #controls { display:none; }
  /* 조행기 iframe 삽입용 (?embed) */
  body.embed { background:transparent; }
  body.embed #stage { width:100vw; height:100vh; aspect-ratio:auto; }
  body.embed #controls { display:none; }
  #replay { position:absolute; right:2.2%; bottom:3.5%; display:none; align-items:center; gap:6px; background:rgba(243,230,196,.92); color:#3b2a1a; border:1px solid #8a6a3a; border-radius:999px; padding:.4em 1em; font:600 clamp(10px, 1.6vw, 13px) 'Noto Sans KR', sans-serif; cursor:pointer; }
  body.embed.done #replay { display:inline-flex; }
</style>
</head>
<body>
<div id="stage">
<svg viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a1a08" stop-opacity=".55"/>
    </radialGradient>
    <mask id="drawMask"><path id="maskPath" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round"/></mask>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--route)"/>
    </marker>
  </defs>

  <g id="camera">
    <image href="map-clean.jpg" width="1672" height="941"/>

    <!-- 예정 경로 (희미한 점선) -->
    <path id="ghost" fill="none" stroke="#7a1d12" stroke-opacity=".28" stroke-width="7" stroke-dasharray="16 12" stroke-linecap="round"/>
    <!-- 주행한 경로 (빛 번짐 + 빨간 점선) -->
    <g mask="url(#drawMask)">
      <path id="trailGlow" fill="none" stroke="#ff6a4a" stroke-opacity=".45" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
      <path id="trail" fill="none" stroke="var(--route)" stroke-width="9" stroke-dasharray="22 13" stroke-linecap="round"/>
    </g>

    <!-- 도착 물결 -->
    <g id="ripples" transform="translate(1150 772)">
      <ellipse class="rip" rx="10" ry="4" fill="none" stroke="#fff" stroke-width="3"/>
      <ellipse class="rip" rx="10" ry="4" fill="none" stroke="#fff" stroke-width="3"/>
      <ellipse class="rip" rx="10" ry="4" fill="none" stroke="#fff" stroke-width="3"/>
    </g>

    <!-- 출발/도착 핀 -->
    <g id="pinStart" transform="translate(745 198)">
      <circle r="9" fill="var(--route)" stroke="#fff" stroke-width="3"/>
      <circle id="pulseStart" r="9" fill="none" stroke="var(--route)" stroke-width="3"/>
    </g>
    <g id="pinEnd" transform="translate(1072 752)" opacity="0">
      <circle r="9" fill="var(--route)" stroke="#fff" stroke-width="3"/>
      <circle id="pulseEnd" r="9" fill="none" stroke="var(--route)" stroke-width="3"/>
    </g>

    <!-- 차량 (탑뷰, +x 방향이 앞) -->
    <g id="car" filter="url(#shadow)">
      <g transform="scale(1.15)">
        <rect x="-30" y="-15" width="60" height="30" rx="10" fill="#1f6fe0" stroke="#0b3d8c" stroke-width="2"/>
        <rect x="-14" y="-12" width="26" height="24" rx="6" fill="#1a5bc0"/>
        <path d="M12,-12 Q20,0 12,12 L6,10 Q11,0 6,-10 z" fill="#bfe3ff" stroke="#0b3d8c" stroke-width="1"/>
        <path d="M-15,-11 Q-21,0 -15,11 L-11,9 Q-15,0 -11,-9 z" fill="#9cc9ee" stroke="#0b3d8c" stroke-width="1"/>
        <rect x="25" y="-13" width="5" height="6" rx="2" fill="#fff6c8"/>
        <rect x="25" y="7" width="5" height="6" rx="2" fill="#fff6c8"/>
        <rect x="-31" y="-13" width="3" height="6" rx="1" fill="#ff3b30"/>
        <rect x="-31" y="7" width="3" height="6" rx="1" fill="#ff3b30"/>
      </g>
      <!-- 헤드라이트 빛 -->
      <path id="beam" d="M36,-12 L95,-34 L95,34 L36,12 z" fill="#fff7c0" opacity=".22"/>
    </g>
  </g>

  <rect width="1672" height="941" fill="url(#vig)" pointer-events="none"/>

  <!-- 정보 배지 (카메라 고정) -->
  <g id="hud" transform="translate(60 60)" opacity="0" font-family="'Nanum Myeongjo', serif">
    <rect width="340" height="104" rx="10" fill="#f3e6c4" stroke="#6b4a24" stroke-width="3" filter="url(#shadow)"/>
    <text x="22" y="40" font-size="24" font-weight="800" fill="#3b2a1a">의정부 → 한터낚시터</text>
    <text id="hudDist" x="22" y="80" font-size="30" font-weight="800" fill="#b3201c">0 km</text>
    <text id="hudStage" x="318" y="80" font-size="20" font-weight="700" fill="#5a4026" text-anchor="end">출발</text>
  </g>

  <!-- 도착 배너 -->
  <g id="arrive" transform="translate(470 560)" opacity="0" font-family="'Nanum Myeongjo', serif">
    <rect x="-230" y="-60" width="460" height="120" rx="14" fill="#f3e6c4" stroke="#6b4a24" stroke-width="4" filter="url(#shadow)"/>
    <text y="-6" font-size="46" font-weight="800" fill="#3b2a1a" text-anchor="middle">한터낚시터 도착</text>
    <text id="arriveSub" y="36" font-size="22" font-weight="700" fill="#7a5a34" text-anchor="middle">용인시 처인구 양지면</text>
  </g>
</svg>
<button id="replay" type="button">↻ 다시 보기</button>
</div>
<div id="controls"><button id="play">▶ 다시 재생</button><button id="pause">❚❚ 일시정지</button></div>

<script>
// 경로 좌표는 원본 지도(1672×941) 기준
const ROUTE = "M745,198 C780,204 800,214 822,240 L988,452 C1008,478 1014,512 1017,556 L1027,690 C1031,734 1048,750 1072,752";
const TOTAL_KM = 75;             // 대략적인 주행 거리 (표시용)
const DUR = 11;                  // 전체 길이(초)
const T_DRIVE0 = 1.6, T_DRIVE1 = 8.4;

const $ = id => document.getElementById(id);
["ghost","trail","trailGlow","maskPath"].forEach(id => $(id).setAttribute("d", ROUTE));
const path = $("trail"), LEN = path.getTotalLength();
$("maskPath").setAttribute("stroke-dasharray", `${LEN} ${LEN}`);

const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const ease = x => x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const easeOutBack = x => { const c=1.70158; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const seg = (t,a,b) => clamp((t-a)/(b-a));
const lerp = (a,b,k) => a + (b-a)*k;

function render(t) {
  const k = ease(seg(t, T_DRIVE0, T_DRIVE1));          // 주행 진행률
  const d = k * LEN;
  const p = path.getPointAtLength(d);
  const q = path.getPointAtLength(Math.min(LEN, d + 2));
  const p0 = path.getPointAtLength(Math.max(0, d - 2));
  const ang = Math.atan2(q.y - p0.y, q.x - p0.x) * 180 / Math.PI;

  // 차량 등장/주행
  const appear = easeOutBack(seg(t, 0.6, 1.3));
  $("car").setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${ang}) scale(${appear})`);
  $("beam").setAttribute("opacity", (0.22 * seg(t, T_DRIVE0, T_DRIVE0 + .4) * (1 - seg(t, T_DRIVE1, T_DRIVE1 + .5))).toFixed(3));

  // 경로 그리기
  $("maskPath").setAttribute("stroke-dashoffset", LEN - d);
  $("ghost").setAttribute("stroke-dashoffset", -t * 30);
  $("trail").setAttribute("stroke-dashoffset", -t * 40);
  $("ghost").setAttribute("opacity", seg(t, 0.2, 1.0));

  // 카메라: 전체 → 차량 추적 확대 → 도착지 → 전체
  const zIn = ease(seg(t, 1.0, 2.6)), zOut = ease(seg(t, 9.2, 10.6));
  const zoom = lerp(1, 1.55, zIn * (1 - zOut));
  const cx = lerp(836, p.x, zIn * (1 - zOut)), cy = lerp(470, p.y, zIn * (1 - zOut));
  const tx = clamp(836 - cx * zoom, 1672 - 1672 * zoom, 0);
  const ty = clamp(470 - cy * zoom, 941 - 941 * zoom, 0);
  $("camera").setAttribute("transform", `translate(${tx} ${ty}) scale(${zoom})`);

  // 출발/도착 핀 펄스
  const pulse = (el, t0) => { const u = ((t - t0) % 1.2 + 1.2) % 1.2 / 1.2; el.setAttribute("r", 9 + u * 26); el.setAttribute("opacity", (1 - u) * (t >= t0 ? 1 : 0)); };
  pulse($("pulseStart"), 0.3);
  $("pinEnd").setAttribute("opacity", seg(t, T_DRIVE1 - .2, T_DRIVE1 + .2));
  pulse($("pulseEnd"), T_DRIVE1);

  // 도착 물결
  document.querySelectorAll(".rip").forEach((el, i) => {
    const u = seg(t, T_DRIVE1 + i * 0.35, T_DRIVE1 + i * 0.35 + 1.4);
    el.setAttribute("rx", 10 + u * 70); el.setAttribute("ry", 4 + u * 26);
    el.setAttribute("opacity", u > 0 ? (1 - u) * .9 : 0);
  });

  // HUD
  $("hud").setAttribute("opacity", seg(t, 0.8, 1.4) * (1 - seg(t, 9.6, 10.2)));
  $("hudDist").textContent = `${Math.round(k * TOTAL_KM)} km`;
  const stage = k < .03 ? "출발" : k < .32 ? "남양주 지나는 중" : k < .52 ? "하남 지나는 중" : k < .78 ? "광주 지나는 중" : k < 1 ? "용인 진입" : "도착";
  $("hudStage").textContent = stage;

  // 도착 배너
  const a = seg(t, 9.6, 10.2);
  $("arrive").setAttribute("opacity", a);
  $("arrive").setAttribute("transform", `translate(470 560) scale(${lerp(.85, 1, easeOutBack(a))})`);
}

// 재생 제어 (녹화 시에는 window.renderAt(t) 직접 호출)
window.renderAt = render;
window.DURATION = DUR;
let start = null, paused = false, pausedAt = 0, raf;
function loop(now) {
  if (start === null) start = now;
  const t = (now - start) / 1000;
  render(Math.min(t, DUR));
  if (t < DUR + 1.5) raf = requestAnimationFrame(loop);
  else document.body.classList.add("done");
}
function play() { cancelAnimationFrame(raf); document.body.classList.remove("done"); start = null; paused = false; raf = requestAnimationFrame(loop); }
$("replay").onclick = play;
$("play").onclick = play;
$("pause").onclick = () => {
  if (!paused) { cancelAnimationFrame(raf); pausedAt = performance.now(); paused = true; }
  else { start += performance.now() - pausedAt; paused = false; raf = requestAnimationFrame(loop); }
};
// ?date=2026.10.23 → 도착 배너에 출조일 표시
const params = new URLSearchParams(location.search);
if (params.get("date")) $("arriveSub").textContent = `${params.get("date")} · 용인시 처인구 양지면`;

if (params.has("record")) { document.body.classList.add("record"); render(0); }
else if (params.has("embed")) {
  // 조행기 안에서는 화면에 절반 이상 보일 때 한 번 재생
  document.body.classList.add("embed"); render(0);
  const io = new IntersectionObserver(es => {
    if (es.some(e => e.intersectionRatio >= .5)) { io.disconnect(); play(); }
  }, { threshold: [.5] });
  io.observe($("stage"));
}
else play();
</script>
</body>
</html>
